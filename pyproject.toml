[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "samanvay-local-node"
version = "0.1.0.dev0"
description = "Experimental no-value Samanvay PoW and rewarded-locking local devnet"
requires-python = ">=3.12"
dependencies = ["cryptography==50.0.2"]
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
samanvay = "samanvay.__main__:main"

[tool.setuptools.packages.find]
include = ["samanvay*"]

name: Python verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned setup-python revision
        with:
          python-version: '3.12'
      - name: Install pinned runtime dependency
        run: python -m pip install -r requirements.txt
      - name: Run syntax and regression checks
        run: bash verify.sh
      - name: Check tracked source manifest
        run: sha256sum -c SHA256SUMS
      - name: Run finite local demo
        run: python examples/local_demo.py
      - name: Run four-process local rehearsal
        run: python examples/operator_rehearsal.py

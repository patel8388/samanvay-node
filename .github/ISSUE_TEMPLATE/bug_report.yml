name: Bug report
description: Report a reproducible non-sensitive problem in the experimental prototype.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Samanvay Node. This is an experimental Python 3.12 prototype, not mainnet software or a public testnet. Do not include wallet/private keys, passwords, SSH credentials, personal device identifiers, or exploitable security details. For a suspected vulnerability, follow SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and the behavior you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide minimal, safe steps using disposable keys/databases and loopback-only transport. Do not paste secrets or exploit code.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Commit or branch
      description: Which revision did you test?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, and relevant runtime details (no device identifiers).
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: Commands and test results
      description: Include safe commands, focused test output, and whether ./verify.sh passed. Redact sensitive values.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety checks
      options:
        - label: I used disposable test data and kept transport loopback-only.
          required: true
        - label: This report contains no secrets, personal device identifiers, or exploitable security details.
          required: true